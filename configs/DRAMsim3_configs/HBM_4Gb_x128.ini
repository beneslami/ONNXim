[dram_structure]
protocol = HBM
bankgroups = 8
banks_per_group = 4
rows = 32768
columns = 64    ; rows and columns are set to achieve 24GB capacity per stack (8 dies * 3GB/die)
device_width = 128
BL = 8
num_dies = 8

[timing]
tCK = 0.25      ; 4.0 GHz clock for 8.0 Gbps
AL = 0
CL = 40         ; Higher frequencies require higher CAS latency
CWL = 20
tRCDRD = 24     ; ~14-16ns
tRCDWR = 20
tRP = 24
tRAS = 56       ; ~32ns
tRFC = 480      ; Scaling for higher density (24Gb/32Gb dies)
tREFI = 7800    ; 3.9us (Standard refresh)
tRPRE = 1
tWPRE = 1
tRRD_S = 4
tRRD_L = 6      ; Increased to account for bank group constraints
tWTR_S = 4
tWTR_L = 12
tFAW = 32
tWR = 30
tCCD_S = 4
tCCD_L = 8      ; Critical for HBM3e performance
tXS = 500
tCKSRE = 10
tXP = 10
tRTP_L = 12
tRTP_S = 8

[power]
VDD = 1.1
IDD0 = 60
IDD2P = 15      ; Improved power gating
IDD2N = 30
IDD3P = 40
IDD3N = 50
IDD4W = 220     ; Significant increase due to high frequency
IDD4R = 240
IDD5AB = 300
IDD6x = 40

[system]
channel_size = 2048     ; HBM3e stacks are usually 16GB or 24GB
channels = 16           ; HBM3e uses 16 channels per stack
bus_width = 128
address_mapping = rorabgbachco
queue_structure = PER_BANK
row_buf_policy = OPEN_PAGE
cmd_queue_size = 16     ; Increased for higher parallelism
trans_queue_size = 64
unified_queue = False

[other]
epoch_period = 500000
output_level = 1
output_prefix = dramsim3_output_

[thermal]
power_epoch_period = 100
logic_bg_power = 6
logic_max_power = 33
chip_dim_x = 0.011
chip_dim_y = 0.010
amb_temp = 40
mat_dim_x = 4096
mat_dim_y = 4096
bank_order = 1
bank_layer_order = 0
