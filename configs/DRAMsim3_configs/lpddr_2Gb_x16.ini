[dram_structure]
protocol = LPDDR
bankgroups = 1
banks_per_group = 8
# rows * columns * device_width * banks / 8 = Capacity per Rank
# 16384 * 1024 * 32 * 8 / 8 = 512MB per rank.
rows = 16384
columns = 1024
device_width = 32
BL = 8

[timing]
# Clock period in ns (1.25ns = 800MHz clock, 1600MT/s)
AL = 0
CL = 10
CWL = 5
tRCD = 12
tRP = 12
tRAS = 30
# tRFC must be higher for 1GB density to avoid refresh starvation
tRFC = 110
tREFI = 3120
tRPRE = 1
tWPRE = 1
tRRD_L = 4
tWTR_L = 6
tFAW = 20
tWR = 12
tCCD_L = 4
tRTP = 6
tXP = 5
tCKE = 5
tRTRS = 1
tCMD = 1
activation_window_depth = 4

[system]
channel_size = 1024
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
row_buf_policy = OPEN_PAGE
cmd_queue_size = 32
trans_queue_size = 64

[other]
validation_output = lpddr_verification.log
epoch_period = 208333
output_level = 1

[thermal]
power_epoch_period = 10000; power epoch period (# cycle)
chip_dim_x = 0.008; chip size in x dimension [m]
chip_dim_y = 0.008; chip size in y dimension [m]
amb_temp = 40; The ambient temperature in [C]
mat_dim_x = 512;
mat_dim_y = 512;
bank_order = 1; 0: x direction first, 1: y direction first

